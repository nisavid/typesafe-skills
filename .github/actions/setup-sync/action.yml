name: Prepare public sync dependencies
description: Install locked CLI dependencies and the reviewed publication helpers without sync credentials.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Install the locked Jev CLI outside the controller
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        tools_dir="$RUNNER_TEMP/sync-tools"
        mkdir -p "$tools_dir" "$RUNNER_TEMP/sync-cache"
        cp "$GITHUB_WORKSPACE/controller/tools/jev/package.json" "$tools_dir/"
        cp "$GITHUB_WORKSPACE/controller/tools/jev/package-lock.json" "$tools_dir/"
        npm ci --prefix "$tools_dir" --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache"
        echo "$tools_dir/node_modules/.bin" >> "$GITHUB_PATH"
        echo "XDG_CACHE_HOME=$RUNNER_TEMP/sync-cache" >> "$GITHUB_ENV"
    - name: Fetch the pinned public publication helpers
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        dependency="$RUNNER_TEMP/provingkit"
        mkdir -p "$dependency" "$RUNNER_TEMP/empty-git-template"
        git init --quiet --template="$RUNNER_TEMP/empty-git-template" "$dependency"
        git -C "$dependency" -c core.hooksPath=/dev/null fetch --quiet --depth=1 --no-tags --no-recurse-submodules \
          https://github.com/nisavid/provingkit.git 379ab8740c7e2541cc93bc2ac986f7fcb29b6c12
        git -C "$dependency" -c core.hooksPath=/dev/null checkout --quiet --detach 379ab8740c7e2541cc93bc2ac986f7fcb29b6c12
        test "$(git -C "$dependency" rev-parse HEAD)" = 379ab8740c7e2541cc93bc2ac986f7fcb29b6c12
        echo "PROVINGKIT_TEST_ROOT=$dependency" >> "$GITHUB_ENV"
