name: Prepare public sync dependencies
description: Install locked CLI dependencies and the reviewed publication helpers without sync credentials.
runs:
  using: composite
  steps:
    - name: Remove image-installed system Git LFS filters
      shell: bash
      run: |
        set -euo pipefail
        read_lfs_names() {
          local config_names config_name
          config_names="$(sudo --non-interactive /usr/bin/git config --system --no-includes --name-only --list)" || return "$?"
          while IFS= read -r config_name; do
            case "$config_name" in
              filter.lfs.*) printf '%s\n' "$config_name" ;;
            esac
          done <<< "$config_names"
        }
        echo 'Inspecting system Git LFS filter names before normalization'
        lfs_names="$(read_lfs_names)"
        if [ -n "$lfs_names" ]; then
          printf '%s\n' "$lfs_names"
          sudo --non-interactive /usr/bin/git config --system --no-includes --remove-section filter.lfs
        fi
        echo 'Verifying system Git LFS filter names after normalization'
        lfs_names="$(read_lfs_names)"
        if [ -n "$lfs_names" ]; then
          printf '%s\n' "$lfs_names"
          echo 'System Git LFS filters remain configured' >&2
          exit 1
        fi
        echo 'System Git LFS filters are absent'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Install the locked Jev CLI outside the controller
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        tools_dir="$RUNNER_TEMP/sync-tools"
        mkdir -p "$tools_dir" "$RUNNER_TEMP/sync-cache"
        cp "$GITHUB_WORKSPACE/controller/tools/jev/package.json" "$tools_dir/"
        cp "$GITHUB_WORKSPACE/controller/tools/jev/package-lock.json" "$tools_dir/"
        npm ci --prefix "$tools_dir" --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache"
        echo "$tools_dir/node_modules/.bin" >> "$GITHUB_PATH"
        echo "XDG_CACHE_HOME=$RUNNER_TEMP/sync-cache" >> "$GITHUB_ENV"
    - name: Fetch the pinned public publication helpers
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        dependency="$RUNNER_TEMP/provingkit"
        mkdir -p "$dependency" "$RUNNER_TEMP/empty-git-template"
        git init --quiet --template="$RUNNER_TEMP/empty-git-template" "$dependency"
        git -C "$dependency" -c core.hooksPath=/dev/null fetch --quiet --depth=1 --no-tags --no-recurse-submodules \
          https://github.com/nisavid/provingkit.git 4d02cc93ad67f2114018d7a595fc6580bb94cfad
        git -C "$dependency" -c core.hooksPath=/dev/null checkout --quiet --detach 4d02cc93ad67f2114018d7a595fc6580bb94cfad
        test "$(git -C "$dependency" rev-parse HEAD)" = 4d02cc93ad67f2114018d7a595fc6580bb94cfad
        echo "PROVINGKIT_TEST_ROOT=$dependency" >> "$GITHUB_ENV"
